name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test

      - name: Build universal app
        run: ./build.sh --universal --zip

      - name: Smoke test
        run: |
          build/Kestrel.app/Contents/Helpers/kestrel --version
          codesign --verify --strict build/Kestrel.app

      - uses: actions/upload-artifact@v7
        with:
          name: Kestrel-app
          path: build/Kestrel-*.zip
          retention-days: 7
