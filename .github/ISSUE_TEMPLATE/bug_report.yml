name: Bug report
description: Something doesn't work or shows the wrong numbers.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Kestrel
        2. Go to Thermals & Fans
        3. ...
  - type: input
    id: version
    attributes:
      label: Kestrel version
      description: About Kestrel in the app menu, or `kestrel --version`.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: macOS 26.1, Mac mini M4
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Output of `kestrel status --json` or `kestrel sensors` helps for wrong readings. Screenshots help too, but blur folder names and command lines you'd rather not share.
